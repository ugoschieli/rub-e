[package]
name = "etib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.34.3"
egui-wgpu = { version = "0.34.3", features = ["winit"] }
egui-winit = "0.34.3"
env_logger = "0.11"
gilrs = "0.11.2"
glam = { version = "0.32", features = ["bytemuck"] }
log = "0.4"
pollster = "0.4"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wgpu = "29"
winit = "0.30"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_panics_doc = "allow"
