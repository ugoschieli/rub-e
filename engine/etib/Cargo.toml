[package]
name = "etib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { workspace = true }
cgmath = "0.18"
env_logger = "0.11"
etib-core = { path = "../etib-core" }
egui = "0.33.3"
egui-wgpu = { version = "0.33.3", features = ["winit"] }
egui-winit = "0.33.3"
image = { version = "0.25.9", features = ["hdr"] }
log = { workspace = true }
pollster = "0.4"
wgpu = { workspace = true }
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.32.1", features = ["bytemuck"] }
half = { version = "2.7.1", features = ["bytemuck"] }
gilrs = "0.11.1"

[dev-dependencies]
tempfile = "3.15.0"
clap = { version = "4.5.59", features = ["derive"] }
bincode = "1.3.3"
pollster = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
